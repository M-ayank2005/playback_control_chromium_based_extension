<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extension Test Player</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #111;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #333;
    }
    h1 { color: #e8e8e8; margin-top: 0; font-size: 20px; font-weight: 700; }
    p { color: #888; font-size: 14px; margin-bottom: 16px; }
    video { width: 100%; border-radius: 8px; background: #000; }
    .info {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background: #111;
      padding: 16px;
      border-radius: 8px;
    }
    .stat { font-size: 12px; color: #888; }
    .stat-val { font-size: 18px; font-weight: 700; color: #e8e8e8; margin-top: 4px; }
  </style>
  <link rel="stylesheet" href="../content/content.css">
</head>
<body>
  <div class="container">
    <h1>Speed Controller — Test Page</h1>
    <p>Standard HTML5 video to verify speed control, overlay, and filters.</p>

    <div style="position: relative; width: 100%; border-radius: 8px; overflow: hidden; background: #000;">
      <video id="testVideo" controls loop autoplay muted>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      </video>
    </div>

    <div class="info">
      <div class="stat">Speed<div class="stat-val" id="speedReadout">1.00x</div></div>
      <div class="stat">Time<div class="stat-val" id="timeReadout">0.0s</div></div>
      <div class="stat">Status<div class="stat-val" id="statusReadout">Playing</div></div>
    </div>
  </div>

  <script>
    const vid = document.getElementById('testVideo');
    const speedReadout = document.getElementById('speedReadout');
    const timeReadout = document.getElementById('timeReadout');
    const statusReadout = document.getElementById('statusReadout');

    function updateStats() {
      speedReadout.textContent = vid.playbackRate.toFixed(2) + 'x';
      timeReadout.textContent = vid.currentTime.toFixed(1) + 's';
      statusReadout.textContent = vid.paused ? 'Paused' : 'Playing';
    }

    vid.addEventListener('ratechange', updateStats);
    vid.addEventListener('timeupdate', updateStats);
    vid.addEventListener('play', updateStats);
    vid.addEventListener('pause', updateStats);
    setInterval(updateStats, 200);
  </script>

  <script>
    window.chrome = window.chrome || {};
    window.chrome.storage = window.chrome.storage || {};
    window.chrome.storage.local = {
      get: (keys, cb) => cb({ speed: 1.0, step: 0.1, rememberSpeed: true, hudEnabled: true, overlayEnabled: true, extensionDisabled: false }),
      set: (obj, cb) => cb && cb()
    };
    window.chrome.runtime = window.chrome.runtime || {};
    window.chrome.runtime.sendMessage = (msg, cb) => cb && cb({ success: true });
    window.chrome.runtime.onMessage = window.chrome.runtime.onMessage || { addListener: () => {} };
    window.chrome.runtime.lastError = null;
  </script>
  <script src="../content/content.js"></script>
</body>
</html>
