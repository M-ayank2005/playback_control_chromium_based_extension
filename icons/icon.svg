<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.3"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#primaryGlow)" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Play Symbol (Left Triangle) -->
  <g filter="url(#dropShadow)">
    <path d="M 140 140 L 290 256 L 140 372 Z" fill="url(#primaryGlow)" />
  </g>

  <!-- Speed Chevron (Right Fast-Forward Chevron) -->
  <g filter="url(#dropShadow)">
    <path d="M 270 140 L 400 256 L 270 372 L 310 256 Z" fill="url(#primaryGlow)" opacity="0.95"/>
  </g>

  <!-- Speed Lightning Overlay Badge -->
  <path d="M 275 110 L 225 240 L 285 240 L 235 390 L 365 220 L 295 220 Z" fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Bottom Accent Dots -->
  <circle cx="180" cy="420" r="10" fill="#38BDF8" />
  <circle cx="256" cy="420" r="14" fill="#FDE047" />
  <circle cx="332" cy="420" r="10" fill="#C084FC" />
</svg>
